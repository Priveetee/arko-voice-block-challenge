name: Build client pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mrpack
        run: zip -r arko-voice-block-challenge.mrpack modrinth.index.json overrides
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: arko-voice-block-challenge.mrpack
