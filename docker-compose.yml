services:
  asr:
    build:
      context: ./asr
    container_name: speak-no-blocks-asr
    restart: unless-stopped
    runtime: nvidia
    environment:
      # The host runs a newer NVIDIA driver than this CUDA base image declares.
      # Keep the GPU visible while bypassing the image's overly narrow driver
      # compatibility range; the actual CUDA runtime remains inside the image.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      NVIDIA_DISABLE_REQUIRE: "1"
      WHISPER_MODEL: "large-v3"
      WHISPER_MODEL_PATH: "/models/models--Systran--faster-whisper-large-v3/snapshots/${WHISPER_MODEL_REVISION:-edaa852ec7e145841d8ffdb056a99866b5f0a478}"
      WHISPER_COMPUTE_TYPE: "int8_float16"
      WHISPER_MODEL_ROOT: "/models"
      # Keep Whisper's context neutral. Enumerating command words here biases
      # homophones such as "or" toward whichever word appears in the prompt.
      ASR_INITIAL_PROMPT: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ASR_MAX_QUEUE: "16"
      ASR_MAX_AUDIO_SECONDS: "6.5"
    volumes:
      - ./asr-models:/models
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

  minecraft:
    image: itzg/minecraft-server:java21
    gpus: all
    container_name: minecraft-voice-block
    restart: unless-stopped
    depends_on:
      asr:
        condition: service_healthy
    ports:
      - "31877:25565/tcp"
      - "31878:31878/udp"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"
      FABRIC_LOADER_VERSION: "0.19.5"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "none"
      MODRINTH_PROJECTS: |
        fabric-api:6qAuTtLR
        simple-voice-chat:CN53keBo
        lithium:Ow7wA0kG
        ferrite-core:Ii0gP3D8
        krypton:O9LmWYR7
        alternate-current:XdouG8YV
        servercore:zg8VIycZ
        spark:gonLOAU1
      MEMORY: "8G"
      USE_AIKAR_FLAGS: "true"
      JVM_XX_OPTS: "-XX:+AlwaysPreTouch -XX:+UseStringDeduplication"
      TZ: "Europe/Paris"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      MAX_PLAYERS: "10"
      MOTD: "Arko Voice Block Challenge"
      DIFFICULTY: "normal"
      MODE: "survival"
      HARDCORE: "FALSE"
      PVP: "TRUE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "75"
      MAX_TICK_TIME: "60000"
      ENABLE_RCON: "FALSE"
      ENABLE_QUERY: "FALSE"
      ENABLE_STATUS: "TRUE"
      USE_NATIVE_TRANSPORT: "TRUE"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      LEVEL: "voice_block_world"
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data:/data
      # Keep the locally built mod outside the image-helper managed directory.
      # The image copies this directory into /data/mods on every startup.
      - ./mods:/mods:ro
      - ./config:/config:ro
    deploy:
      resources:
        limits:
          memory: 12G
    stdin_open: true
    tty: true
